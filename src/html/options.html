<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>danime-save-annict-2 設定</title>
  <link rel="stylesheet" href="../css/options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>danime-save-annict-2 設定</h1>
      <p>dアニメストア・Amazon Prime Video・AbemaTVの視聴記録をAnnictに送信します</p>
    </header>

    <main>
      <section class="section">
        <h2>Annict連携設定</h2>
        <div class="form-group">
          <label for="annictToken">Annict APIトークン *</label>
          <input type="password" id="annictToken" placeholder="Annictから取得したAPIトークンを入力">
          <small>
            <a href="https://annict.com/settings/apps" target="_blank">Annictでトークンを取得</a>
          </small>
        </div>
      </section>

      <section class="section">
        <h2>Webhook設定</h2>
        <div class="form-group">
          <label>
            <input type="checkbox" id="enableWebhook"> Webhookを有効にする
          </label>
        </div>
        <div class="form-group" id="webhookSection">
          <label for="webhookUrl">Webhook URL</label>
          <div id="webhookUrls">
            <div class="webhook-input">
              <input type="url" placeholder="https://hooks.slack.com/services/...">
              <button type="button" class="btn-remove">削除</button>
            </div>
          </div>
          <button type="button" id="addWebhook" class="btn btn-secondary">Webhook URLを追加</button>
        </div>
      </section>

      <section class="section">
        <h2>その他の設定</h2>
        <div class="form-group">
          <label>
            <input type="checkbox" id="autoSend" checked> 自動送信を有効にする
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="debugMode"> デバッグモードを有効にする
          </label>
        </div>
      </section>

      <section class="section">
        <h2>対応サイト</h2>
        <ul class="site-list">
          <li>dアニメストア (animestore.docomo.ne.jp)</li>
          <li>Amazon Prime Video (amazon.co.jp)</li>
          <li>AbemaTV (abema.tv)</li>
        </ul>
      </section>
    </main>

    <footer>
      <div class="button-group">
        <button type="button" id="saveButton" class="btn btn-primary">設定を保存</button>
        <button type="button" id="testButton" class="btn btn-secondary">接続テスト</button>
      </div>
      <div id="status" class="status"></div>
    </footer>
  </div>

  <script src="../scripts/options.js"></script>
</body>
</html>
